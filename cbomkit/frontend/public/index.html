<!DOCTYPE html>
<html lang="">
  <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
        <title><%= VUE_APP_TITLE %></title>
        <script type="text/javascript">
            if (!('process' in window)) {
                window.process = {};
            }
        </script>
        <script type="module">
          window.digitalData = {
            page: {
              pageInfo: {
                language: 'en-US',
                ibm: {
                  country: 'US',
                  siteID: 'IBM_CBOM',
                },
              },
              isDataLayerReady: true,
            },
          };
        </script>
        <style id="hide-cbom-footer">
          footer, c4d-footer-container, c4d-footer, .bx--footer, .c4d--footer, [size="short"] {
            display: none !important;
            visibility: hidden !important;
            height: 0 !important;
            max-height: 0 !important;
            overflow: hidden !important;
          }
          .search-button.folder-enabled,
          .search-button:not([disabled]) {
            cursor: pointer !important;
            pointer-events: auto !important;
            opacity: 1 !important;
          }
          .folder-plus-icon,
          .binary-box-icon {
            width: 16px !important;
            height: 16px !important;
            fill: currentColor !important;
            display: inline-block !important;
            vertical-align: middle !important;
            pointer-events: none !important;
          }

          /* 1. Remove yellow "Not compliant" banner and any compliance notification banner */
          .bx--inline-notification,
          .cds--inline-notification,
          .bx--inline-notification--warning,
          .cds--inline-notification--warning,
          .bx--inline-notification--error,
          .cds--inline-notification--error,
          .bx--inline-notification--info,
          .cds--inline-notification--info,
          cv-inline-notification,
          .skeleton-bordered:has(h6) {
            display: none !important;
            visibility: hidden !important;
            height: 0 !important;
            max-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            overflow: hidden !important;
            pointer-events: none !important;
          }

          /* 2. Remove red "Invalid CBOM" alert and toast notifications */
          .bx--toast-notification[title*="Invalid CBOM"],
          .cds--toast-notification[title*="Invalid CBOM"],
          .bx--toast-notification:has([title*="Invalid CBOM"]),
          .cds--toast-notification:has([title*="Invalid CBOM"]),
          .notificationContainer:has([title*="Invalid CBOM"]),
          .bx--toast-notification:has(.bx--toast-notification__title:empty),
          .cds--toast-notification:has(.cds--toast-notification__title:empty) {
            display: none !important;
            visibility: hidden !important;
            height: 0 !important;
            max-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            pointer-events: none !important;
          }
        </style>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
