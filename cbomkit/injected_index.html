  function enterScanningState(displayName) {
    isScanning = true;
    window.__isScanningActive = true;
    window.__isAnalysisCompleted = false;

    if (m) {

          m.codeOrigin.gitUrl = effectiveName;
          m.codeOrigin.uploadedFileName = null;
        }
      }
      if (!m.cbom) {
        m.cbom = {
          bomFormat: "CycloneDX",

  function extractDetectionsFromCbom(cbom) {
    if (!cbom || !Array.isArray(cbom.components)) return [];
    var detections = [];
    cbom.components.forEach(function (c) {
      if (c && (c.type === "cryptographic-asset" || !c.type || c.cryptoProperties)) {
        if (c.evidence && Array.isArray(c.evidence.occurrences) && c.evidence.occurrences.length > 0) {
          c.evidence.occurrences.forEach(function (occ) {
            var single = JSON.parse(JSON.stringify(c));
            single.evidence.occurrences = [occ];
            detections.push(single);
          });
        } else {
          detections.push(c);
        }
      }
    });
    return detections;
  }

  var lastRenderedCbomSignature = '';
  function updateLiveVueCbom(cbomJson, uploadName, isLiveScanning) {
    if (!cbomJson || !Array.isArray(cbomJson.components)) {
      return false;
    }

    var m = window.cbomModel || window.model;
    if (!m) return false;

    var totalOccurrences = cbomJson.components.reduce(function(acc, c) {
      return acc + ((c.evidence && c.evidence.occurrences) ? c.evidence.occurrences.length : 1);
    }, 0);
    var lastRef = cbomJson.components.length > 0 ? (cbomJson.components[cbomJson.components.length - 1]['bom-ref'] || '') : 'empty';
    var signature = currentAnalysisId + ':' + cbomJson.components.length + ':' + totalOccurrences + ':' + lastRef + ':' + (isLiveScanning ? 'scan' : 'done');
    if (signature === lastRenderedCbomSignature) {
      return false;
    }
    lastRenderedCbomSignature = signature;

    var effectiveName = uploadName || (cbomJson.metadata && cbomJson.metadata.component && cbomJson.metadata.component.name) || window.__selectedFolderName || window.__selectedBinaryName || 'project';
    var curMode = resolveCurrentMode();

    if (m.codeOrigin) {
      if (curMode === 'git' || (effectiveName && (effectiveName.startsWith('http') || effectiveName.includes('.git')))) {
        m.codeOrigin.gitUrl = effectiveName;
        m.codeOrigin.uploadedFileName = null;
        m.codeOrigin.projectIdentifier = effectiveName;
      } else if (curMode === 'folder' || curMode === 'binary') {
        m.codeOrigin.gitUrl = null;
        m.codeOrigin.uploadedFileName = effectiveName;
        m.codeOrigin.projectIdentifier = effectiveName;
      } else {
        m.codeOrigin.gitUrl = null;
        m.codeOrigin.uploadedFileName = null;
        m.codeOrigin.projectIdentifier = effectiveName;
      }
    }

    m.useDarkMode = true;
    if (typeof window.showResultFromUpload === 'function') {
      window.showResultFromUpload(cbomJson, effectiveName);
    } else {
      m.cbom = cbomJson;
      m.showResults = true;
    }

    if (curMode === 'git') {
      m.codeOrigin.uploadedFileName = null;
      m.codeOrigin.gitUrl = effectiveName;
      m.codeOrigin.projectIdentifier = effectiveName;
    }

    if (m.scanning) {
      m.scanning.isScanning = false;
      m.scanning.scanningStatus = isLiveScanning ? 'scanning' : 'loaded';
      m.scanning.liveDetections = extractDetectionsFromCbom(cbomJson);
    }

    createAndSetLocalCompliance(cbomJson, m);
    return true;
  }

  function startLivePolling() {
    if (livePollTimer || !currentAnalysisId) return;
    var pollCycle = async function() {
      try {
        var statusRes = await fetch('http://localhost:3001/api/analyses/' + encodeURIComponent(currentAnalysisId) + '/status');
        if (statusRes.ok) {
          var st = await statusRes.json();
          var m = window.cbomModel || window.model;

          if (st.status === 'RUNNING') {
            var curMode = resolveCurrentMode();
            var runningName = (curMode === 'git' && (window.__lastScannedGitUrl || st.repositoryUrl)) ? (window.__lastScannedGitUrl || st.repositoryUrl) : (st.applicationName || st.repositoryUrl);
            enterScanningState(runningName);
            applyModeIfNeeded();

            var cbomRes = await fetch('http://localhost:3001/api/analyses/' + encodeURIComponent(currentAnalysisId) + '/cbom').catch(function() { return null; });
            if (cbomRes && cbomRes.ok) {
              var cbomData = await cbomRes.json();
              if (cbomData && Array.isArray(cbomData.components)) {
                var compName = (cbomData.metadata && cbomData.metadata.component && cbomData.metadata.component.name);
                var effName = (curMode === 'git' && (window.__lastScannedGitUrl || st.repositoryUrl || compName)) ? (window.__lastScannedGitUrl || st.repositoryUrl || compName) : (compName || st.applicationName || st.repositoryUrl || window.__selectedFolderName || window.__selectedBinaryName || 'project');
                updateLiveVueCbom(cbomData, effName, true);
              }
            }
          } else if (st.status === 'COMPLETED') {
            clearInterval(livePollTimer);
            livePollTimer = null;
            isScanning = false;
            window.__isScanningActive = false;
            window.__isAnalysisCompleted = true;
            
            try {
              var assetsRes = await fetch('http://localhost:3001/api/analyses/' + encodeURIComponent(currentAnalysisId) + '/assets');
              if (assetsRes.ok) {
                var assets = await assetsRes.json();
                if (assets) setAuthoritativeAssets(assets);
              }
            } catch(e) {}

            var finalRes = await fetch('http://localhost:3001/api/analyses/' + encodeURIComponent(currentAnalysisId) + '/cbom').catch(function() { return null; });
            if (finalRes && finalRes.ok) {
              var finalData = await finalRes.json();
              var finalCompName = (finalData.metadata && finalData.metadata.component && finalData.metadata.component.name);
              var curMode = resolveCurrentMode();
              var finalEffName = (curMode === 'git' && (window.__lastScannedGitUrl || st.repositoryUrl || finalCompName)) ? (window.__lastScannedGitUrl || st.repositoryUrl || finalCompName) : (finalCompName || st.applicationName || st.repositoryUrl || window.__selectedFolderName || window.__selectedBinaryName || 'project');
              console.log('[CRYPTAVISTA] CBOM generated: ' + currentAnalysisId);
              console.log('[CRYPTAVISTA] CBOM loaded: ' + currentAnalysisId);
              updateLiveVueCbom(finalData, finalEffName, false);
            }
            applyModeIfNeeded();
          } else if (st.status === 'FAILED') {
            clearInterval(livePollTimer);
            livePollTimer = null;
            isScanning = false;
            window.__isScanningActive = false;
            applyModeIfNeeded();
            if (m && m.scanning) {
              m.scanning.isScanning = false;
              m.scanning.scanningStatus = 'error';
            }
          } else if (st.status === 'CREATED' || st.status === 'WAITING_FOR_INPUT') {
            // Waiting for user input; do not reset model or erase user's typed input
            isScanning = false;
          }
        }
      } catch (e) {}
    };
    pollCycle();
    livePollTimer = setInterval(pollCycle, 500);
  }

  async function checkBackendAnalysisType() {
    try {
      if (!currentAnalysisId) {
        var p = new URLSearchParams(window.location.search);
        currentAnalysisId = p.get('analysisId') || '';
        var tParam = p.get('targetType');
        if (tParam) window.__targetType = tParam;
        var sParam = p.get('sourceType');
        if (sParam) window.__sourceType = sParam;
      }

      if (!currentAnalysisId) {
        resetVueModel();
        applyModeIfNeeded();
        return;
      }

      var detailRes = await fetch('http://localhost:3001/api/analyses/' + encodeURIComponent(currentAnalysisId));
      if (detailRes.ok) {
        var detail = await detailRes.json();
        if (detail.sourceType) window.__sourceType = detail.sourceType;
        if (detail.targetType) window.__targetType = detail.targetType;

        var m = window.cbomModel || window.model;
        var curMode = resolveCurrentMode();
        var appDisplayName = (curMode === 'git' && (window.__lastScannedGitUrl || detail.repositoryUrl)) ? (window.__lastScannedGitUrl || detail.repositoryUrl) : (detail.applicationName || detail.repositoryUrl || 'project');

        if (detail.status === 'RUNNING') {
          enterScanningState(appDisplayName);
          startLivePolling();
        } else if (detail.status === 'CREATED' || detail.status === 'WAITING_FOR_INPUT') {
          // Ready for user input or scan start
          isScanning = false;
          window.__isScanningActive = false;
          window.__isAnalysisCompleted = false;
          if (livePollTimer) {
            clearInterval(livePollTimer);
            livePollTimer = null;
          }
          resetVueModel();
          applyModeIfNeeded();
        } else if (detail.status === 'COMPLETED') {
          isScanning = false;
          window.__isScanningActive = false;
          window.__isAnalysisCompleted = true;
          if (m && m.scanning) m.scanning.isScanning = false;
          try {
            var assetsRes = await fetch('http://localhost:3001/api/analyses/' + encodeURIComponent(currentAnalysisId) + '/assets');
            if (assetsRes.ok) {
              var assets = await assetsRes.json();
              if (assets) setAuthoritativeAssets(assets);
            }
          } catch(e) {}

          var existingCbomRes = await fetch('http://localhost:3001/api/analyses/' + encodeURIComponent(currentAnalysisId) + '/cbom').catch(function() { return null; });
          if (existingCbomRes && existingCbomRes.ok) {
            var existingCbom = await existingCbomRes.json();
            if (existingCbom && Array.isArray(existingCbom.components)) {
              console.log('[CRYPTAVISTA] CBOM loaded: ' + currentAnalysisId);
              updateLiveVueCbom(existingCbom, appDisplayName, false);
            } else if (existingCbom) {
              // CBOM exists but may have been fetched in unexpected format; log and skip gracefully
              console.warn('[CRYPTAVISTA] CBOM response format unexpected for: ' + currentAnalysisId);
            }
          } else if (!existingCbomRes || existingCbomRes.status === 404) {
            // CBOM record does not exist yet (may have 0 assets) - show result view with empty CBOM
            console.log('[CRYPTAVISTA] No CBOM record found for completed analysis: ' + currentAnalysisId + ' (0 assets)');
            var mComp = window.cbomModel || window.model;
            if (mComp) {
              mComp.showResults = true;
              if (mComp.scanning) {
                mComp.scanning.isScanning = false;
                mComp.scanning.scanningStatus = 'loaded';
              }
              // Set minimal CBOM with metadata so the visualization renders correctly (no assets)
              if (!mComp.cbom) {
                mComp.cbom = {
                  bomFormat: 'CycloneDX',
                  specVersion: '1.6',
                  metadata: { component: { name: appDisplayName, type: 'application' } },
                  components: [],
                  dependencies: []
                };
              }
            }
          }
        }
      }
      applyModeIfNeeded();
    } catch (e) {}
  }

  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'UPDATE_ASSETS') {
      if (e.data.assets && e.data.assets.length > 0) {
        setAuthoritativeAssets(e.data.assets);
      }
      return;
    }
    if (e.data.type === 'LOAD_ANALYSIS') {
      if (e.data.assets && e.data.assets.length > 0) {
        setAuthoritativeAssets(e.data.assets);
      }
      if (e.data.analysisId) {
        var isSameAnalysis = (e.data.analysisId === currentAnalysisId);
        if (!isSameAnalysis) {
          lastRenderedCbomSignature = '';

          if (livePollTimer) {

        }
      }
      if (e.data.sourceType) window.__sourceType = e.data.sourceType;
      if (e.data.targetType) window.__targetType = e.data.targetType;
      if (e.data.status === 'CREATED' || e.data.status === 'WAITING_FOR_INPUT') {
        isScanning = false;
        window.__isScanningActive = false;
        window.__isAnalysisCompleted = false;
        if (livePollTimer) {

      applyModeIfNeeded();
      checkBackendAnalysisType();
    } else if (e.data.type === 'SCAN_STARTED' || e.data.type === 'FOLDER_SCAN_STARTED' || e.data.type === 'BINARY_SCAN_STARTED' || e.data.type === 'CONTAINER_SCAN_STARTED' || e.data.type === 'GIT_SCAN_STARTED') {

  function suppressLimitedComplianceToast() {
    var m = window.cbomModel || window.model;
    if (m) {
      if (!m.__complianceAlertSuppressed) {
        m.__complianceAlertSuppressed = true;
        var origAddError = m.addError ? m.addError.bind(m) : null;
        if (origAddError) {
          m.addError = function(status, msg) {
            var st = (status || '').toString();
            if (st.indexOf('FallBackLocalComplianceReport') !== -1 || st.indexOf('InvalidCbom') !== -1) {
              return;
            }
            return origAddError(status, msg);
          };
        }
      }
      if (Array.isArray(m.errors)) {
        for (var i = m.errors.length - 1; i >= 0; i--) {
          var errSt = m.errors[i] ? (m.errors[i].status || '').toString() : '';
          var errMsg = m.errors[i] ? (m.errors[i].message || '').toString() : '';
          if (errSt.indexOf('FallBackLocalComplianceReport') !== -1 || errSt.indexOf('InvalidCbom') !== -1 ||
              errMsg.indexOf('Invalid CBOM') !== -1 || errMsg.indexOf('expected format') !== -1) {
            m.errors.splice(i, 1);
          }
        }
      }
    }

    var toasts = document.querySelectorAll('.bx--toast-notification, .cds--toast-notification');
    for (var j = 0; j < toasts.length; j++) {
      var t = toasts[j];
      var txt = t.textContent || '';
      var titleAttr = t.getAttribute('title') || '';
      if (txt.indexOf('Limited compliance') !== -1 || txt.indexOf('remote compliance service') !== -1 || titleAttr.indexOf('Limited compliance') !== -1 ||
          txt.indexOf('Invalid CBOM') !== -1 || txt.indexOf('expected format') !== -1 || titleAttr.indexOf('Invalid CBOM') !== -1) {
        t.style.display = 'none';
        var parent = t.closest ? t.closest('.notificationContainer') : t.parentNode;
        if (parent && parent.classList && parent.classList.contains('notificationContainer')) {
          parent.style.display = 'none';
        }
      }
    }

    var inlineNotifs = document.querySelectorAll('.bx--inline-notification, .cds--inline-notification');
    for (var k = 0; k < inlineNotifs.length; k++) {
      var inNotif = inlineNotifs[k];
      var inTxt = inNotif.textContent || '';
      if (inTxt.indexOf('compliant') !== -1 || inTxt.indexOf('policy') !== -1 || inTxt.indexOf('Compliance') !== -1 || inTxt.indexOf('quantum_safe') !== -1 || inTxt.indexOf('Analyzing compliance') !== -1) {
        inNotif.style.display = 'none';
        inNotif.style.height = '0';
        inNotif.style.margin = '0';
        inNotif.style.padding = '0';
        var p = inNotif.parentElement;
        if (p && p.style && p.style.paddingTop === '12px') {
          p.style.display = 'none';
        }
      }
    }

    var skel = document.querySelectorAll('.skeleton-bordered');
    for (var s = 0; s < skel.length; s++) {
      if (skel[s].textContent && skel[s].textContent.indexOf('Analyzing compliance') !== -1) {
        skel[s].style.display = 'none';
      }
    }
  }

  setInterval(suppressLimitedComplianceToast, 100);

    dropBox.addEventListener('dragleave', function() {

    });
    dropBox.addEventListener('drop', function(e) {

      dropBox.classList.remove('drag-over');
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        var files = Array.from(e.dataTransfer.files);

  function setupContainerInput() {
    var searchInput = document.querySelector('.search-bar input.bx--search-input');
    if (!searchInput) return;

    var expectedPlaceholder = 'Enter container image reference (e.g. nginx:latest, ubuntu:latest)';
    if (searchInput.placeholder !== expectedPlaceholder && !searchInput.value) {
      searchInput.placeholder = expectedPlaceholder;
    }

    var scanButtons = document.querySelectorAll('.search-button, button.search-button, .search button');
    scanButtons.forEach(function(btn) {
      if (isScanning) {
        btn.disabled = true;
        btn.setAttribute('disabled', 'disabled');
        btn.classList.add('bx--btn--disabled');
        btn.textContent = 'Scanning...';
      } else {
        var hasText = searchInput.value && searchInput.value.trim().length > 0;
        btn.disabled = !hasText;
        if (hasText) {
          btn.removeAttribute('disabled');
          btn.removeAttribute('aria-disabled');
          btn.classList.remove('bx--btn--disabled', 'cds--btn--disabled');
          btn.classList.add('folder-enabled');
          btn.style.pointerEvents = 'auto';
          btn.style.opacity = '1';
          btn.style.cursor = 'pointer';
        } else {
          btn.setAttribute('disabled', 'disabled');
          btn.classList.remove('folder-enabled');
        }
      }

      if (!btn.__containerBound) {
        btn.__containerBound = true;
        btn.addEventListener('click', function(e) {
          if (resolveCurrentMode() === 'container') {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            var val = searchInput ? searchInput.value.trim() : '';
            if (val) window.__startContainerScan(val);
          }
        }, true);
      }
    });

    if (!searchInput.__containerKeyBound) {
      searchInput.__containerKeyBound = true;
      var syncContainerInput = function() {
        var m = window.cbomModel || window.model;
        if (m && m.codeOrigin) {
          m.codeOrigin.scanUrl = searchInput.value;
        }
        if (resolveCurrentMode() === 'container') {
          setupContainerInput();
        }
      };
      searchInput.addEventListener('input', syncContainerInput);
      searchInput.addEventListener('change', syncContainerInput);
      searchInput.addEventListener('keydown', function(e) {
        if (resolveCurrentMode() === 'container' && e.key === 'Enter') {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          var val = searchInput.value.trim();
          if (val) window.__startContainerScan(val);
        }
      }, true);
    }
  }

      if (magWrapper) {
        var existingSvg = magWrapper.querySelector('svg');
        if (!existingSvg || existingSvg.getAttribute('data-icon-type') !== 'container') {
          magWrapper.innerHTML = '<svg focusable="false" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true" class="bx--search-magnifier-icon" data-icon-type="container" width="16" height="16" viewBox="0 0 32 32"><path d="M28 6H4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h24a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zM4 8h24v3H4zm0 5h24v4H4zm0 6h24v5H4z"></path></svg>';
        }
      } else {
        var directSvg = bar.querySelector('svg.bx--search-magnifier, svg.cds--search-magnifier, svg.bx--search-magnifier-icon, svg.cds--search-magnifier-icon');
        if (directSvg && directSvg.getAttribute('data-icon-type') !== 'container') {
          directSvg.setAttribute('data-icon-type', 'container');
          directSvg.setAttribute('viewBox', '0 0 32 32');
          directSvg.innerHTML = '<path d="M28 6H4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h24a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zM4 8h24v3H4zm0 5h24v4H4zm0 6h24v5H4z"></path>';
        }
      }
    });

    searchBars.forEach(function(bar) {
      var magWrapper = bar.querySelector('.bx--search-magnifier:not(svg), .cds--search-magnifier:not(svg)');
      if (magWrapper) {
        var existingSvg = magWrapper.querySelector('svg');
        if (existingSvg && (existingSvg.getAttribute('data-icon-type') === 'container')) {
          magWrapper.innerHTML = '<svg focusable="false" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true" class="bx--search-magnifier-icon" width="16" height="16" viewBox="0 0 16 16"><path d="M15,14.3L10.7,10c1.9-2.3,1.6-5.8-0.7-7.7S4.2,0.7,2.3,3S0.7,8.8,3,10.7c2,1.7,5,1.7,7,0l4.3,4.3L15,14.3z M2,6.5 C2,4,4,2,6.5,2S11,4,11,6.5S9,11,6.5,11S2,9,2,6.5z"></path></svg>';

  function setupGitInput() {
    var searchInput = document.querySelector('.search-bar input.bx--search-input');
    if (!searchInput) return;

    var expectedPlaceholder = 'Enter Git URL or Package URL to scan (e.g. https://github.com/example/project)';
    if (searchInput.placeholder !== expectedPlaceholder && !searchInput.value) {
      searchInput.placeholder = expectedPlaceholder;
    }

    var scanButtons = document.querySelectorAll('.search-button, button.search-button, .search button');
    scanButtons.forEach(function(btn) {
      var m = window.cbomModel || window.model;
      var curVal = (searchInput && searchInput.value) || (m && m.codeOrigin && m.codeOrigin.scanUrl) || '';
      var hasText = curVal.trim().length > 0;

      if (isScanning) {
        btn.disabled = true;
        btn.setAttribute('disabled', 'disabled');
        btn.classList.add('bx--btn--disabled');
        btn.textContent = 'Scanning...';
      } else {
        btn.disabled = !hasText;
        if (hasText) {
          btn.removeAttribute('disabled');
          btn.removeAttribute('aria-disabled');
          btn.classList.remove('bx--btn--disabled', 'cds--btn--disabled');
          btn.classList.add('folder-enabled');
          btn.style.pointerEvents = 'auto';
          btn.style.opacity = '1';
          btn.style.cursor = 'pointer';
        } else {
          btn.setAttribute('disabled', 'disabled');
          btn.classList.remove('folder-enabled');
        }
      }

      if (!btn.__gitBound) {
        btn.__gitBound = true;
        btn.addEventListener('click', function(e) {
          if (resolveCurrentMode() === 'git') {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            var m = window.cbomModel || window.model;
            var val = (searchInput ? searchInput.value : '') || (m && m.codeOrigin && m.codeOrigin.scanUrl) || '';
            if (val && val.trim().length > 0) {
              window.__startGitScan(val.trim());
            }
          }
        }, true);
      }
    });

    if (!searchInput.__gitKeyBound) {
      searchInput.__gitKeyBound = true;
      var syncGitInput = function() {
        var m = window.cbomModel || window.model;
        if (m && m.codeOrigin) {
          m.codeOrigin.scanUrl = searchInput.value;
        }
        setupGitInput();
      };
      searchInput.addEventListener('input', syncGitInput);
      searchInput.addEventListener('change', syncGitInput);
      searchInput.addEventListener('keydown', function(e) {
        if (resolveCurrentMode() === 'git' && e.key === 'Enter') {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          var m = window.cbomModel || window.model;
          var val = (searchInput ? searchInput.value : '') || (m && m.codeOrigin && m.codeOrigin.scanUrl) || '';
          if (val && val.trim().length > 0) {
            window.__startGitScan(val.trim());
          }
        }
      }, true);
    }
  }

  function applyModeIfNeeded() {
    suppressLimitedComplianceToast();
    updateBrandTitle();
    updateScanningSubtitle();

    var cardContainers = document.querySelectorAll('.card-container');
    if (!cardContainers || cardContainers.length === 0) return;

    var leftCard = cardContainers[0];
    var rightCard = cardContainers.length > 1 ? cardContainers[1] : null;

    var mode = resolveCurrentMode();

    if (rightCard) {
      var rightTitle = rightCard.querySelector('.icon-and-title-container .title');
      if (rightTitle && rightTitle.textContent.trim() !== 'Upload a CBOM') {
        rightTitle.textContent = 'Upload a CBOM';
      }
      var rightSub = rightCard.querySelector('.body-text');
      if (rightSub && rightSub.textContent.trim() !== 'Upload an existing CBOM to visualize it.') {
        rightSub.textContent = 'Upload an existing CBOM to visualize it.';
      }
    }

    var leftTitle = leftCard.querySelector('.icon-and-title-container .title');
    var leftIconContainer = leftCard.querySelector('.icon-and-title-container');
    var leftSubtitle = leftCard.querySelector('.body-text');
    var leftSearch = leftCard.querySelector('.search');
    var leftFilter = leftCard.querySelector('.filter-checkbox') || (leftSearch && leftSearch.nextElementSibling);

    var existingFolderZone = document.getElementById('cbom-custom-folder-dropzone');
    var existingBinaryZone = document.getElementById('cbom-custom-binary-dropzone');

    function setLeftIcon(svgHtml) {
      if (!leftIconContainer) return;
      var curSvg = leftIconContainer.querySelector('svg');
      if (curSvg) {
        var temp = document.createElement('div');
        temp.innerHTML = svgHtml;
        var newSvg = temp.firstElementChild;
        if (newSvg && curSvg.outerHTML !== newSvg.outerHTML) {
          leftIconContainer.replaceChild(newSvg, curSvg);
        }
      }
    }

    if (mode === 'folder') {
      document.body.classList.remove('binary-mode-active', 'container-mode-active');
      document.body.classList.add('folder-mode-active');

      if (leftTitle && leftTitle.textContent.trim() !== 'Upload Project Folder') {
        leftTitle.textContent = 'Upload Project Folder';
      }
      setLeftIcon(folderSvg);
      if (leftSubtitle && leftSubtitle.textContent.trim() !== 'Upload a project folder to scan and generate a CBOM.') {
        leftSubtitle.textContent = 'Upload a project folder to scan and generate a CBOM.';
      }

      if (leftSearch) leftSearch.style.setProperty('display', 'none', 'important');
      if (leftFilter) leftFilter.style.setProperty('display', 'none', 'important');
      if (existingBinaryZone) existingBinaryZone.style.display = 'none';

      var folderZone = getOrCreateFolderDropzone(leftCard, leftSubtitle);
      folderZone.style.display = 'block';
      updateFolderDropzoneState(folderZone);

    } else if (mode === 'binary') {
      document.body.classList.remove('folder-mode-active', 'container-mode-active');
      document.body.classList.add('binary-mode-active');

      if (leftTitle && leftTitle.textContent.trim() !== 'Upload Binary / Library') {
        leftTitle.textContent = 'Upload Binary / Library';
      }
      setLeftIcon(binarySvg);
      if (leftSubtitle && leftSubtitle.textContent.trim() !== 'Upload a binary or cryptographic library to scan and generate a CBOM.') {
        leftSubtitle.textContent = 'Upload a binary or cryptographic library to scan and generate a CBOM.';
      }

      if (leftSearch) leftSearch.style.setProperty('display', 'none', 'important');
      if (leftFilter) leftFilter.style.setProperty('display', 'none', 'important');
      if (existingFolderZone) existingFolderZone.style.display = 'none';

      var binaryZone = getOrCreateBinaryDropzone(leftCard, leftSubtitle);
      binaryZone.style.display = 'block';
      updateBinaryDropzoneState(binaryZone);

    } else if (mode === 'container') {
      document.body.classList.remove('folder-mode-active', 'binary-mode-active');
      document.body.classList.add('container-mode-active');

      if (leftTitle && leftTitle.textContent.trim() !== 'Generate a new CBOM') {
        leftTitle.textContent = 'Generate a new CBOM';
      }
      setLeftIcon(addAltSvg);
      if (leftSubtitle && leftSubtitle.textContent.trim() !== 'Enter a container image reference to scan and generate a CBOM.') {
        leftSubtitle.textContent = 'Enter a container image reference to scan and generate a CBOM.';
      }

      if (existingFolderZone) existingFolderZone.style.display = 'none';
      if (existingBinaryZone) existingBinaryZone.style.display = 'none';

      if (leftSearch) leftSearch.style.removeProperty('display');
      if (leftFilter) leftFilter.style.removeProperty('display');

      setupContainerInput();
      replaceSearchIconWithContainer();

    } else {
      // Git mode
      document.body.classList.remove('folder-mode-active', 'binary-mode-active', 'container-mode-active');

      if (leftTitle && leftTitle.textContent.trim() !== 'Generate a new CBOM') {
        leftTitle.textContent = 'Generate a new CBOM';
      }
      setLeftIcon(addAltSvg);
      if (leftSubtitle && leftSubtitle.textContent.trim() !== 'Submit a public Git repository to scan and generate a CBOM.') {
        leftSubtitle.textContent = 'Submit a public Git repository to scan and generate a CBOM.';
      }

      if (existingFolderZone) existingFolderZone.style.display = 'none';
      if (existingBinaryZone) existingBinaryZone.style.display = 'none';

      if (leftSearch) leftSearch.style.removeProperty('display');
      if (leftFilter) leftFilter.style.removeProperty('display');

      setupGitInput();
      restoreSearchIcon();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyModeIfNeeded);
  } else {
    applyModeIfNeeded();
  }

  setInterval(applyModeIfNeeded, 200);
})();
